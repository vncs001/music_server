# O HTTPS e o domínio ficam com o painel da VPS (nginx dele, aba "Portas e Domínios").
# Aqui sobe só o servidor Python, na porta 8000.
services:
  server:
    build: .
    ports:
      # 127.0.0.1 = só o nginx da própria VPS acessa; ninguém de fora fala direto com a porta 8000
      - "127.0.0.1:8000:8000"
    environment:
      # valores vêm das variáveis do painel (ou de um arquivo .env nesta pasta)
      API_TOKEN: ${API_TOKEN:?defina API_TOKEN}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      COOKIES_FILE: ${COOKIES_FILE:-}
      MAX_FILE_AGE_HOURS: ${MAX_FILE_AGE_HOURS:-24}
      MAX_PARALLEL_DOWNLOADS: ${MAX_PARALLEL_DOWNLOADS:-2}
    volumes:
      - downloads:/data/downloads
      # coloque aqui o cookies.txt, se precisar (veja README)
      - ./secrets:/secrets:ro
    restart: unless-stopped

volumes:
  downloads:
